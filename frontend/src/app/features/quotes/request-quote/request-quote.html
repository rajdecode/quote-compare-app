<div class="container page-content">
    <div class="glass-panel form-card">
        <h2>Request a Quote</h2>
        <p class="subtitle">Tell us what you need, and we'll match you with top vendors.</p>

        <form (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="serviceType">Service Type</label>
                <select id="serviceType" [(ngModel)]="serviceType" name="serviceType" required>
                    <option value="heat-pump">Heat Pumps</option>
                    <option value="water-filter">Water Filters</option>
                    <option value="aircon">Aircons</option>
                    <option value="battery">Batteries</option>
                </select>
            </div>

            @if (!authService.currentUser()) {
            <div class="form-group">
                <label for="email">Email Address <span class="required">*</span></label>
                <input type="email" id="email" [(ngModel)]="email" name="email" required
                    placeholder="To receive your quotes">
            </div>
            }

            <div class="form-group-row" style="display: flex; gap: 1rem;">
                <div class="form-group" style="flex: 1;">
                    <label for="postalCode">Postal Code</label>
                    <input type="text" id="postalCode" [(ngModel)]="postalCode" name="postalCode" required
                        placeholder="e.g. 2000">
                </div>
                <div class="form-group" style="flex: 2;">
                    <label for="suburb">Suburb</label>
                    <input type="text" id="suburb" [(ngModel)]="suburb" name="suburb" required
                        placeholder="e.g. Sydney">
                </div>
            </div>

            <div class="form-group">
                <label for="details">Project Details</label>
                <textarea id="details" [(ngModel)]="details" name="details" rows="4"
                    placeholder="Describe your home type, current heating system, etc."></textarea>
            </div>

            <div class="form-group">
                <label for="attachment">Attachment (PDF only, Optional)</label>
                <div class="file-upload-wrapper"
                    style="border: 2px dashed #e5e7eb; padding: 20px; text-align: center; border-radius: 8px;">
                    <input type="file" id="attachment" (change)="onFileSelected($event)" accept=".pdf"
                        [disabled]="isUploading" style="display: block; margin: 0 auto;">
                    @if (isUploading) {
                    <p style="color: var(--primary-color); margin-top: 10px;">Uploading...</p>
                    }
                    @if (attachments.length > 0) {
                    <div class="file-preview"
                        style="margin-top: 10px; color: #059669; display: flex; align-items: center; justify-content: center; gap: 5px;">
                        <span class="material-icons" style="font-size: 1.2rem;">check_circle</span>
                        <span>File attached successfully</span>
                        <button type="button" class="btn btn-sm btn-text text-danger" (click)="attachments=[]"
                            style="margin-left: 10px; color: #dc2626;">Remove</button>
                    </div>
                    }
                    @if (uploadError) {
                    <p style="color: #dc2626; margin-top: 10px;">{{ uploadError }}</p>
                    }
                </div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn btn-secondary" routerLink="/buyer">Cancel</button>
                <button type="submit" class="btn btn-primary" [disabled]="loading">
                    {{ loading ? 'Submitting...' : 'Submit Request' }}
                </button>
            </div>
        </form>
    </div>
</div>
