<div class="settings-container">
    <h3>Service Settings</h3>
    <p class="subtitle">Control which leads you receive.</p>

    <div class="form-group">
        <label>Service Postcodes</label>
        <p class="hint">Comma separated (e.g. 2000, 2001, 2010)</p>
        <input type="text" [(ngModel)]="servicePostcodes" placeholder="2000, 2001..." class="input-light">
    </div>

    <div class="form-group">
        <label>Service Suburbs</label>
        <p class="hint">Comma separated (e.g. Sydney, Surry Hills)</p>
        <input type="text" [(ngModel)]="serviceSuburbs" placeholder="Sydney, Newtown..." class="input-light">
    </div>

    <div class="form-group">
        <label>Service States (Covers all postcodes in state)</label>
        <div class="checkbox-grid">
            @for (state of availableStates; track state) {
            <label class="checkbox-label">
                <input type="checkbox" [checked]="serviceStates.has(state)" (change)="toggleState(state)">
                {{ state }}
            </label>
            }
        </div>
    </div>

    <div class="form-group">
        <label>Services Offered</label>
        <div class="checkbox-grid">
            @for (service of availableServices; track service.id) {
            <label class="checkbox-label">
                <input type="checkbox" [checked]="servicesOffered.has(service.id)" (change)="toggleService(service.id)">
                {{ service.label }}
            </label>
            }
        </div>
    </div>

    <div class="actions">
        <button class="btn btn-primary" (click)="saveSettings()" [disabled]="loading()">
            {{ loading() ? 'Saving...' : 'Save Settings' }}
        </button>
        @if (successMessage()) {
        <span class="success-msg">{{ successMessage() }}</span>
        }
    </div>
</div>
