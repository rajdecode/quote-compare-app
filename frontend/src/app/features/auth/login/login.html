<div class="auth-page">
    <div class="auth-card glass-panel">
        <h2>Welcome Back to <span class="highlight">Quote</span>Compare</h2>
        <p class="subtitle">Sign in to manage your quotes and requests.</p>

        <form (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" [(ngModel)]="email" name="email" required placeholder="name@example.com">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" [(ngModel)]="password" name="password" required
                    placeholder="••••••••">
            </div>

            <div class="form-group" style="text-align: right; margin-top: -10px;">
                <a routerLink="/forgot-password" style="font-size: 0.9rem; color: var(--primary);">Forgot Password?</a>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-block" [disabled]="loading" *ngIf="!loading">
                    Sign In
                </button>
                <div *ngIf="loading" class="loading-state">
                    <button class="btn btn-primary btn-block" disabled>
                        Signing In...
                    </button>
                    <button type="button" class="btn btn-link btn-sm cancel-btn" (click)="cancel()">
                        Cancel
                    </button>
                </div>
            </div>

            <div class="auth-footer">
                <p>Don't have an account? <a routerLink="/register">Register here</a></p>
                <div class="debug-actions" style="margin-top: 10px; opacity: 0.7;">
                    <p class="version-text">v1.3.4 (Raw Fetch)</p>
                    <button type="button" class="btn btn-link btn-sm" (click)="testConnection()"
                        style="font-size: 0.8rem;">Test Connection</button>
                </div>
            </div>

            <div *ngIf="errorMessage" class="error-message">
                {{ errorMessage }}
            </div>
        </form>
    </div>
</div>
